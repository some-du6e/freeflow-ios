name: iOS TestFlight

# Builds the FreeFlow iOS app and keyboard for devices, signs them for App
# Store Connect with cloud-managed signing, checks the signed entitlements,
# and uploads the build to TestFlight for internal testing.
# Setup and usage: ios/TESTFLIGHT.md.
#
# High risk (AGENTS.md): this workflow signs and uploads builds with an App
# Store Connect API key. The key and its IDs are secrets of the `testflight`
# environment, which should require a reviewer's approval for every run.
# Nothing here runs for a pull request or a push.
#
# The archive job builds the branch's code with no access to the key. The
# testflight job, the only one that can read the key, runs nothing from the
# branch but this workflow, the .github/scripts/ios-testflight-*.sh scripts,
# and ios/Config/ExportOptions-TestFlight.plist. A Run Script phase or a
# build setting can therefore never reach the key.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run only. Archive with a placeholder team and check it, with no secrets, no approval and no upload.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  archive:
    name: ${{ inputs.dry_run && 'Archive (dry run, placeholder team)' || 'Archive' }}
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      # Repository variables: this job has no environment, so it can't read
      # the testflight environment's values. A dry run uses a made-up team.
      TEAM_ID: ${{ inputs.dry_run && 'ABCDE12345' || vars.APPLE_TEAM_ID }}
      BUNDLE_ID_PREFIX: ${{ vars.FREEFLOW_BUNDLE_ID_PREFIX || (inputs.dry_run && 'dev.karim.freeflow' || '') }}
    outputs:
      team_id: ${{ steps.settings.outputs.team_id }}
      bundle_id_prefix: ${{ steps.settings.outputs.bundle_id_prefix }}
      build_number: ${{ steps.settings.outputs.build_number }}
      archive_sha256: ${{ steps.pack.outputs.archive_sha256 }}

    steps:
      - name: Check the settings
        id: settings
        env:
          BUILD_NUMBER_OFFSET: ${{ vars.FREEFLOW_BUILD_NUMBER_OFFSET }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          # Secrets this job can see live at the repository level, where every
          # workflow on every branch can read them without approval.
          REPOSITORY_SECRETS: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 != '' || secrets.APP_STORE_CONNECT_KEY_ID != '' || secrets.APP_STORE_CONNECT_ISSUER_ID != '' }}
        run: |
          if [ "$REPOSITORY_SECRETS" = true ]; then
            echo "::error title=App Store Connect secret at repository level::Delete the APP_STORE_CONNECT_* repository secrets and keep them only in the testflight environment. See ios/TESTFLIGHT.md."
            exit 1
          fi
          if [ -z "$TEAM_ID" ]; then
            echo "::error title=Missing TestFlight setting::Set the repository variable APPLE_TEAM_ID. See ios/TESTFLIGHT.md."
            exit 1
          fi
          if [ -z "$BUNDLE_ID_PREFIX" ]; then
            echo "::error title=Missing TestFlight setting::Set the repository variable FREEFLOW_BUNDLE_ID_PREFIX. See ios/TESTFLIGHT.md."
            exit 1
          fi
          if [[ ! $TEAM_ID =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::Variable APPLE_TEAM_ID must be the 10-character Team ID, got '$TEAM_ID'."
            exit 1
          fi
          if [[ ! $BUNDLE_ID_PREFIX =~ ^[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)+$ ]]; then
            echo "::error::Variable FREEFLOW_BUNDLE_ID_PREFIX must be a bundle ID such as dev.karim.freeflow, got '$BUNDLE_ID_PREFIX'."
            exit 1
          fi
          if [[ ! ${BUILD_NUMBER_OFFSET:-0} =~ ^[0-9]{1,9}$ ]]; then
            echo "::error::Variable FREEFLOW_BUILD_NUMBER_OFFSET must be a whole number, got '$BUILD_NUMBER_OFFSET'."
            exit 1
          fi
          # App Store Connect rejects a build number that isn't higher than the
          # last upload of this version. A re-run keeps github.run_number, so it
          # gets <number>.<attempt>, which sorts after <number> and before
          # <number + 1>.
          build_number=$((RUN_NUMBER + 10#${BUILD_NUMBER_OFFSET:-0}))
          if [ "$RUN_ATTEMPT" -gt 1 ]; then
            build_number="$build_number.$RUN_ATTEMPT"
          fi
          {
            echo "team_id=$TEAM_ID"
            echo "bundle_id_prefix=$BUNDLE_ID_PREFIX"
            echo "build_number=$build_number"
          } >> "$GITHUB_OUTPUT"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          echo "Team $TEAM_ID, bundle ID prefix $BUNDLE_ID_PREFIX, build $build_number."

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Show toolchain
        run: xcodebuild -version

      - name: Archive with an ad-hoc signature
        run: .github/scripts/ios-testflight-archive.sh "$RUNNER_TEMP/testflight" "$TEAM_ID" "$BUNDLE_ID_PREFIX" "$BUILD_NUMBER"

      - name: Check the archive's identifiers and entitlements
        run: |
          .github/scripts/ios-testflight-verify.sh archive \
            "$RUNNER_TEMP/testflight/FreeFlow.xcarchive/Products/Applications/FreeFlow.app" \
            "$TEAM_ID" "$BUNDLE_ID_PREFIX" "$BUILD_NUMBER"

      # ditto keeps the permissions and symlinks that a code signature
      # covers. The artifact service would drop them from loose files.
      - name: Pack the archive
        id: pack
        run: |
          ditto -c -k --keepParent --norsrc --noextattr --noqtn \
            "$RUNNER_TEMP/testflight/FreeFlow.xcarchive" "$RUNNER_TEMP/FreeFlow.xcarchive.zip"
          echo "archive_sha256=$(shasum -a 256 "$RUNNER_TEMP/FreeFlow.xcarchive.zip" | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"

      - name: Upload the archive for the signing job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: freeflow-xcarchive
          path: ${{ runner.temp }}/FreeFlow.xcarchive.zip
          if-no-files-found: error
          retention-days: 1

  testflight:
    name: ${{ inputs.dry_run && 'Check the archive hand-off (dry run, no secrets)' || 'Sign and upload to TestFlight' }}
    needs: archive
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 45
    # "testflight" for every real run. A dry run resolves to no environment,
    # so it needs no approval, gets none of the environment's secrets, and
    # skips every step that would use them.
    environment: ${{ (github.event_name == 'workflow_dispatch' && !inputs.dry_run) && 'testflight' || '' }}
    # One upload at a time, and never cancel one that has started.
    concurrency:
      group: ${{ inputs.dry_run && format('ios-testflight-dry-run-{0}', github.run_id) || 'ios-testflight-upload' }}
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    env:
      TEAM_ID: ${{ needs.archive.outputs.team_id }}
      BUNDLE_ID_PREFIX: ${{ needs.archive.outputs.bundle_id_prefix }}
      BUILD_NUMBER: ${{ needs.archive.outputs.build_number }}

    steps:
      - name: Check the testflight environment's settings
        if: ${{ !inputs.dry_run }}
        env:
          HAS_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 != '' }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ENVIRONMENT_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ENVIRONMENT_BUNDLE_ID_PREFIX: ${{ vars.FREEFLOW_BUNDLE_ID_PREFIX }}
        run: |
          missing=()
          [ "$HAS_KEY_P8" = true ] || missing+=("APP_STORE_CONNECT_API_KEY_P8")
          [ -n "$ASC_KEY_ID" ] || missing+=("APP_STORE_CONNECT_KEY_ID")
          [ -n "$ASC_ISSUER_ID" ] || missing+=("APP_STORE_CONNECT_ISSUER_ID")
          if [ "${#missing[@]}" -gt 0 ]; then
            for name in "${missing[@]}"; do
              echo "::error title=Missing TestFlight setting::The testflight environment has no secret $name. See ios/TESTFLIGHT.md."
            done
            exit 1
          fi
          invalid=0
          if [[ ! $ASC_KEY_ID =~ ^[A-Z0-9]{10}$ ]]; then
            echo "::error::Secret APP_STORE_CONNECT_KEY_ID must be the 10-character key ID."
            invalid=1
          fi
          if [[ ! $ASC_ISSUER_ID =~ ^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$ ]]; then
            echo "::error::Secret APP_STORE_CONNECT_ISSUER_ID must be the issuer ID, a UUID."
            invalid=1
          fi
          # An environment variable of the same name overrides the repository
          # variable here, but the archive job only sees the repository one.
          if [ "$ENVIRONMENT_TEAM_ID" != "$TEAM_ID" ] || [ "$ENVIRONMENT_BUNDLE_ID_PREFIX" != "$BUNDLE_ID_PREFIX" ]; then
            echo "::error::The testflight environment sets APPLE_TEAM_ID or FREEFLOW_BUNDLE_ID_PREFIX to something other than the repository variables the archive used. Keep them only as repository variables."
            invalid=1
          fi
          [ "$invalid" -eq 0 ] || exit 1
          echo "Signing build $BUILD_NUMBER of $BUNDLE_ID_PREFIX for team $TEAM_ID."

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Show toolchain
        run: xcodebuild -version

      - name: Download the archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: freeflow-xcarchive
          path: ${{ runner.temp }}/handoff

      - name: Unpack the archive
        env:
          ARCHIVE_SHA256: ${{ needs.archive.outputs.archive_sha256 }}
        run: |
          actual=$(shasum -a 256 "$RUNNER_TEMP/handoff/FreeFlow.xcarchive.zip" | cut -d ' ' -f 1)
          if [ "$actual" != "$ARCHIVE_SHA256" ]; then
            echo "::error::The downloaded archive's SHA-256 is $actual, but the archive job packed $ARCHIVE_SHA256."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/testflight"
          ditto -x -k "$RUNNER_TEMP/handoff/FreeFlow.xcarchive.zip" "$RUNNER_TEMP/testflight"

      # The archive comes from a job that ran the branch's build, so check it
      # again here before anything signs it.
      - name: Check the archive's identifiers and entitlements
        run: |
          .github/scripts/ios-testflight-verify.sh archive \
            "$RUNNER_TEMP/testflight/FreeFlow.xcarchive/Products/Applications/FreeFlow.app" \
            "$TEAM_ID" "$BUNDLE_ID_PREFIX" "$BUILD_NUMBER"

      - name: Write the export options
        run: .github/scripts/ios-testflight-export-options.sh "$RUNNER_TEMP/testflight/ExportOptions.plist" "$TEAM_ID"

      - name: Install the App Store Connect API key
        if: ${{ !inputs.dry_run }}
        env:
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: .github/scripts/ios-testflight-install-key.sh

      # Cloud-managed signing: Apple signs with the team's Apple Distribution
      # certificate, and -allowProvisioningUpdates creates or refreshes the
      # App Store profiles for the app and the keyboard. Both need an Admin
      # API key, and neither puts a private signing key on the runner.
      - name: Export and sign for App Store Connect
        if: ${{ !inputs.dry_run }}
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/testflight/FreeFlow.xcarchive" \
            -exportPath "$RUNNER_TEMP/testflight/export" \
            -exportOptionsPlist "$RUNNER_TEMP/testflight/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Check the signed IPA before upload
        if: ${{ !inputs.dry_run }}
        run: |
          shopt -s nullglob
          ipas=("$RUNNER_TEMP"/testflight/export/*.ipa)
          if [ "${#ipas[@]}" -ne 1 ]; then
            echo "::error::Expected one .ipa in the export folder, found ${#ipas[@]}."
            ls -la "$RUNNER_TEMP/testflight/export" || true
            exit 1
          fi
          echo "IPA_PATH=${ipas[0]}" >> "$GITHUB_ENV"
          ditto -x -k "${ipas[0]}" "$RUNNER_TEMP/testflight/ipa"
          .github/scripts/ios-testflight-verify.sh ipa \
            "$RUNNER_TEMP/testflight/ipa/Payload/FreeFlow.app" \
            "$TEAM_ID" "$BUNDLE_ID_PREFIX" "$BUILD_NUMBER"

      - name: Upload to TestFlight
        if: ${{ !inputs.dry_run }}
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          # altool finds AuthKey_<key ID>.p8 in API_PRIVATE_KEYS_DIR, or in
          # ./private_keys relative to the working directory.
          cd "$RUNNER_TEMP"
          set +e
          xcrun altool --upload-app --type ios --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/altool.log"
          status=${PIPESTATUS[0]}
          set -e
          # Xcode 26's altool can exit 0 after a failed upload, so read its
          # output too. It prints "UPLOAD FAILED" and "ERROR:" lines; the
          # legacy altool printed "*** Error".
          if [ "$status" -ne 0 ] || grep -Eq 'UPLOAD FAILED|\*\*\* Error|(^|[[:space:]])ERROR:' "$RUNNER_TEMP/altool.log"; then
            echo "::error::altool reported a failed upload (exit status $status). See its output above."
            exit 1
          fi
          if ! grep -Eq 'UPLOAD SUCCEEDED|No errors uploading' "$RUNNER_TEMP/altool.log"; then
            echo "::warning::altool exited 0 without a success line. Check Build Uploads in the app's TestFlight tab."
          fi

      - name: Summarize
        if: ${{ !inputs.dry_run }}
        run: |
          version=$(plutil -extract CFBundleShortVersionString raw -o - "$RUNNER_TEMP/testflight/ipa/Payload/FreeFlow.app/Info.plist")
          {
            echo "### Uploaded FreeFlow $version ($BUILD_NUMBER) to App Store Connect"
            echo
            echo "Bundle ID \`$BUNDLE_ID_PREFIX\`, team \`$TEAM_ID\`, exported for internal TestFlight testing only."
            echo "App Store Connect emails you when it finishes processing the build. The first time, check that"
            echo "TestFlight shows the Internal marker under the build number (ios/TESTFLIGHT.md, Uploading a build)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the App Store Connect API key
        if: always()
        run: rm -rf "${RUNNER_TEMP:?}/private_keys"
