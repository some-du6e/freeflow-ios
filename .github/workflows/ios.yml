name: iOS

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "ios-wip/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (Xcode 26.6, iOS 26.5)
    runs-on: macos-26
    # A build of up to 8 minutes, the simulator setup and a 20-minute Test
    # step, with room left for the reports and the result upload.
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      DERIVED_DATA_PATH: build/ios/DerivedData
      RESULT_BUNDLE_PATH: build/ios/FreeFlow.xcresult
      ATTACHMENTS_PATH: build/ios/attachments
      DIAGNOSTICS_PATH: build/ios/diagnostics
      APP_PATH: build/ios/DerivedData/Build/Products/Debug-iphonesimulator/FreeFlow.app
      SIMULATOR_NAME: iPhone 17
      SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Show toolchain and simulators
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devices available

      - name: Show resolved build settings
        run: |
          xcodebuild -showBuildSettings -json \
            -project ios/FreeFlow.xcodeproj \
            -alltargets \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM= \
            | jq '.[] | {target, settings: (.buildSettings | {
                PRODUCT_BUNDLE_IDENTIFIER, IPHONEOS_DEPLOYMENT_TARGET, SWIFT_VERSION,
                TARGETED_DEVICE_FAMILY, MARKETING_VERSION, CURRENT_PROJECT_VERSION,
                SWIFT_TREAT_WARNINGS_AS_ERRORS, CODE_SIGN_STYLE, CODE_SIGN_IDENTITY,
                DEVELOPMENT_TEAM, AppIdentifierPrefix, CODE_SIGN_ENTITLEMENTS,
                INFOPLIST_FILE, APPLICATION_EXTENSION_API_ONLY, LD_RUNPATH_SEARCH_PATHS,
                TEST_HOST, TEST_TARGET_NAME, ENABLE_DEBUG_DYLIB})}' \
            || echo "::warning::Could not show build settings"

      - name: Self-test the mock provider
        run: python3 .github/scripts/mock-openai-server.py --self-test

      # Starts booting now so the first boot's data migration overlaps the
      # build. Simulator.app never runs here, so the hardware keyboard default
      # is only a guard: a connected hardware keyboard hides the software
      # keyboard the UI tests drive.
      - name: Boot simulator
        run: |
          udid="$(xcrun simctl list devices available --json | jq -r \
            --arg runtime "$SIMULATOR_RUNTIME" --arg name "$SIMULATOR_NAME" \
            '[.devices[$runtime][]? | select(.name == $name)][0].udid // empty')"
          if [ -z "$udid" ]; then
            echo "::error::No available $SIMULATOR_NAME simulator for $SIMULATOR_RUNTIME"
            exit 1
          fi
          echo "Booting $SIMULATOR_NAME ($udid)"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl boot "$udid" || echo "simctl boot exited with $?; the wait step boots it again"

      # Ad-hoc signing with no team keeps code signing enabled, so Xcode still
      # embeds the App Group and keychain entitlements in the simulator build.
      # CODE_SIGNING_ALLOWED=NO would drop them.
      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project ios/FreeFlow.xcodeproj \
            -scheme FreeFlow \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM=

      - name: Wait for the simulator to boot
        timeout-minutes: 5
        run: xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      # Installs the app, grants the microphone, enables the FreeFlow keyboard
      # with Full Access, and reboots the simulator. See the script's header.
      - name: Prepare the simulator for keyboard tests
        timeout-minutes: 6
        run: .github/scripts/prepare-ios-simulator.sh configure "$SIMULATOR_UDID" "$APP_PATH"

      # The app and keyboard reach it at http://127.0.0.1:8765/v1, because the
      # simulator shares the runner's network stack. It logs request metadata
      # only.
      - name: Start the mock provider
        run: |
          mkdir -p "$DIAGNOSTICS_PATH"
          # The latency, like a real provider's, keeps the keyboard's
          # processing state on screen long enough for the tests to see it.
          nohup python3 .github/scripts/mock-openai-server.py \
            --host 127.0.0.1 --port 8765 --latency 2 \
            --log "$DIAGNOSTICS_PATH/mock-provider-requests.jsonl" \
            < /dev/null > "$DIAGNOSTICS_PATH/mock-provider.log" 2>&1 &
          echo "MOCK_PROVIDER_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 30); do
            if curl -fsS --connect-timeout 2 --max-time 5 http://127.0.0.1:8765/healthz; then
              echo
              echo "The mock provider is up after $attempt check(s)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::The mock provider did not answer its health check"
          cat "$DIAGNOSTICS_PATH/mock-provider.log"
          exit 1

      - name: Test
        timeout-minutes: 20
        run: |
          mkdir -p "$DIAGNOSTICS_PATH"
          test_log="$DIAGNOSTICS_PATH/xcodebuild-test.log"
          # The keyboard's own log and FreeFlow's handoff lines, streamed live
          # because the simulator doesn't keep info-level lines for later.
          # They hold state names, capture events, counts, rates and the first
          # 8 characters of handoff session IDs, never text or audio. The
          # stream starts when the UI tests do, so it adds no load to the
          # unit tests.
          (
            until grep -q "Test Suite 'FreeFlowUITests.xctest' started" "$test_log" 2>/dev/null; do
              sleep 2
            done
            exec xcrun simctl spawn "$SIMULATOR_UDID" log stream --level info --style compact \
              --predicate "subsystem == \"$FREEFLOW_KEYBOARD_ID\" OR (subsystem == \"$FREEFLOW_APP_ID\" AND category == \"Handoff\")"
          ) < /dev/null > "$DIAGNOSTICS_PATH/keyboard.log" 2>&1 &
          echo "KEYBOARD_LOG_PID=$!" >> "$GITHUB_ENV"
          xcodebuild test-without-building \
            -project ios/FreeFlow.xcodeproj \
            -scheme FreeFlow \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            -resultBundlePath "$RESULT_BUNDLE_PATH" \
            -skip-testing:FreeFlowUITests/FreeFlowScreenshotTests \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 420 \
            2>&1 | tee "$test_log"

      - name: Report the UI tests' findings
        if: always()
        run: |
          if [ -n "${KEYBOARD_LOG_PID:-}" ]; then
            kill "$KEYBOARD_LOG_PID" 2>/dev/null || true
            echo "::group::The keyboard's capture sessions, state changes and handoffs"
            grep -E 'Capture session [0-9]+ (starting|audio graph started|finished|failed|stop timed out)|Capture start failed|:(Keyboard|Handoff)\] ' \
              "$DIAGNOSTICS_PATH/keyboard.log" | cut -c1-320 || echo "(none logged)"
            echo "::endgroup::"
          fi
          log="$DIAGNOSTICS_PATH/xcodebuild-test.log"
          if [ ! -f "$log" ]; then
            echo "No test log at $log"
            exit 0
          fi
          {
            echo "### FreeFlow UI test findings"
            echo
            grep -h 'FREEFLOW-E2E:' "$log" | sed 's/^.*FREEFLOW-E2E: /- /' | awk '!seen[$0]++' || echo "- (none reported)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          if grep -q 'CI setup did NOT take effect' "$log"; then
            echo "::warning::The simulator setup did not enable the FreeFlow keyboard or Full Access; the UI tests fell back to the Settings app"
          fi

      - name: Summarize test results
        if: always()
        run: |
          if [ ! -d "$RESULT_BUNDLE_PATH" ]; then
            echo "No result bundle at $RESULT_BUNDLE_PATH"
            exit 0
          fi
          xcrun xcresulttool get test-results tests --path "$RESULT_BUNDLE_PATH" \
            || echo "::warning::Could not summarize $RESULT_BUNDLE_PATH"

      - name: Export test attachments
        if: always()
        run: |
          .github/scripts/export-test-attachments.sh "$RESULT_BUNDLE_PATH" "$ATTACHMENTS_PATH"
          ls -la "$ATTACHMENTS_PATH" 2>/dev/null || true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-test-results
          path: |
            ${{ env.ATTACHMENTS_PATH }}
            ${{ env.RESULT_BUNDLE_PATH }}
            ${{ env.DIAGNOSTICS_PATH }}
          if-no-files-found: warn
          retention-days: 14

      - name: Show mock provider requests
        if: always()
        run: |
          if [ -z "${MOCK_PROVIDER_PID:-}" ]; then
            echo "The mock provider was not started"
            exit 0
          fi
          curl -fsS http://127.0.0.1:8765/debug/requests | python3 -m json.tool \
            || echo "::warning::Could not read the mock provider's request log"
          echo "::group::Mock provider output"
          cat "$DIAGNOSTICS_PATH/mock-provider.log" || true
          echo "::endgroup::"
          kill "$MOCK_PROVIDER_PID" 2>/dev/null || true

      - name: Show the simulator's keyboard and Full Access state
        if: always()
        timeout-minutes: 5
        run: |
          if [ -z "${SIMULATOR_UDID:-}" ] || [ -z "${FREEFLOW_APP_ID:-}" ]; then
            echo "The simulator was never prepared, so there is no keyboard state to show"
            exit 0
          fi
          .github/scripts/prepare-ios-simulator.sh report "$SIMULATOR_UDID" \
            "$FREEFLOW_APP_ID" "$FREEFLOW_KEYBOARD_ID"

      - name: Inspect app bundle and entitlements
        if: always()
        run: |
          app="$APP_PATH"
          appex="$app/PlugIns/FreeFlowKeyboard.appex"
          if [ ! -d "$app" ]; then
            echo "No app bundle at $app"
            exit 0
          fi

          echo "::group::FreeFlow.app/PlugIns"
          ls -la "$app/PlugIns" || true
          echo "::endgroup::"
          if [ ! -d "$appex" ]; then
            # Xcode signs the app only after embedding the keyboard, so an
            # unsigned app means the build stopped early, not a project error.
            if [ ! -f "$app/_CodeSignature/CodeResources" ]; then
              echo "FreeFlow.app was not signed, so the build stopped before embedding the keyboard. See the Build for testing step."
              exit 0
            fi
            echo "::error::FreeFlowKeyboard.appex is not embedded in FreeFlow.app/PlugIns"
            exit 1
          fi

          for bundle in "$app" "$appex"; do
            echo "::group::Built Info.plist: $(basename "$bundle")"
            plutil -p "$bundle/Info.plist" || true
            echo "::endgroup::"
          done

          # Whether each bundle that talks to the mock provider carries App
          # Transport Security exceptions.
          runner="$(dirname "$app")/FreeFlowUITests-Runner.app"
          for bundle in "$app" "$appex" "$runner"; do
            [ -f "$bundle/Info.plist" ] || continue
            echo "NSAppTransportSecurity in $(basename "$bundle"):"
            plutil -extract NSAppTransportSecurity json -o - "$bundle/Info.plist" 2>/dev/null || echo "  (none)"
            echo
          done

          for bundle in "$app" "$appex"; do
            echo "::group::Code signature entitlements: $(basename "$bundle")"
            codesign -d --entitlements :- "$bundle" || true
            echo "::endgroup::"
          done

          # Simulator builds carry their entitlements in a __TEXT,__entitlements
          # section of the executable rather than in the code signature.
          for binary in "$app/FreeFlow" "$app/FreeFlow.debug.dylib" \
            "$appex/FreeFlowKeyboard" "$appex/FreeFlowKeyboard.debug.dylib"; do
            [ -f "$binary" ] || continue
            echo "::group::__TEXT,__entitlements: ${binary#"$DERIVED_DATA_PATH/Build/Products/"}"
            python3 - "$binary" <<'PY' || echo "Could not read the entitlements section"
          import struct
          import sys

          path = sys.argv[1]
          with open(path, "rb") as binary:
              data = binary.read()
          if struct.unpack_from("<I", data)[0] != 0xFEEDFACF:
              sys.exit(f"{path} is not a thin 64-bit Mach-O file")
          offset = 32
          for _ in range(struct.unpack_from("<I", data, 16)[0]):
              command, command_size = struct.unpack_from("<II", data, offset)
              if command == 0x19:  # LC_SEGMENT_64
                  for index in range(struct.unpack_from("<I", data, offset + 64)[0]):
                      section = offset + 72 + index * 80
                      name = data[section:section + 16].rstrip(b"\0")
                      segment = data[section + 16:section + 32].rstrip(b"\0")
                      if (segment, name) == (b"__TEXT", b"__entitlements"):
                          size, file_offset = struct.unpack_from("<QI", data, section + 40)
                          print(data[file_offset:file_offset + size].decode())
                          sys.exit(0)
              offset += command_size
          print("No __TEXT,__entitlements section")
          PY
            echo "::endgroup::"
          done

  # Review screenshots of every keyboard state in light and dark mode. Its
  # own job keeps the main test job short; the two run side by side.
  screenshots:
    name: Screenshots (Xcode 26.6, iOS 26.5)
    runs-on: macos-26
    # Two passes of about 9 minutes each, after a build that takes up to 8.
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      DERIVED_DATA_PATH: build/ios/DerivedData
      SCREENSHOTS_PATH: build/ios/screenshots
      APP_PATH: build/ios/DerivedData/Build/Products/Debug-iphonesimulator/FreeFlow.app
      SIMULATOR_NAME: iPhone 17
      SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app

      - name: Boot simulator
        run: |
          udid="$(xcrun simctl list devices available --json | jq -r \
            --arg runtime "$SIMULATOR_RUNTIME" --arg name "$SIMULATOR_NAME" \
            '[.devices[$runtime][]? | select(.name == $name)][0].udid // empty')"
          if [ -z "$udid" ]; then
            echo "::error::No available $SIMULATOR_NAME simulator for $SIMULATOR_RUNTIME"
            exit 1
          fi
          echo "Booting $SIMULATOR_NAME ($udid)"
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl boot "$udid" || echo "simctl boot exited with $?; the wait step boots it again"

      - name: Build for testing
        run: |
          xcodebuild build-for-testing \
            -project ios/FreeFlow.xcodeproj \
            -scheme FreeFlow \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM=

      - name: Wait for the simulator to boot
        timeout-minutes: 5
        run: xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      - name: Prepare the simulator for keyboard tests
        timeout-minutes: 6
        run: .github/scripts/prepare-ios-simulator.sh configure "$SIMULATOR_UDID" "$APP_PATH"

      - name: Start the mock provider
        run: |
          # The latency keeps every recorder's processing state on screen. The
          # request log is metadata only and is uploaded with the screenshots.
          mkdir -p "$SCREENSHOTS_PATH"
          nohup python3 .github/scripts/mock-openai-server.py --host 127.0.0.1 --port 8765 --latency 2 \
            --log "$SCREENSHOTS_PATH/mock-provider-requests.jsonl" \
            < /dev/null > "$RUNNER_TEMP/mock-provider.log" 2>&1 &
          for attempt in $(seq 1 30); do
            curl -fsS --connect-timeout 2 --max-time 5 http://127.0.0.1:8765/healthz && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/mock-provider.log"
          exit 1

      # The tests name each screenshot after the appearance they're told.
      - name: Take screenshots
        timeout-minutes: 32
        run: |
          status=0
          for appearance in light dark; do
            xcrun simctl ui "$SIMULATOR_UDID" appearance "$appearance"
            TEST_RUNNER_FREEFLOW_APPEARANCE="$appearance" xcodebuild test-without-building \
              -project ios/FreeFlow.xcodeproj \
              -scheme FreeFlow \
              -configuration Debug \
              -destination "platform=iOS Simulator,id=$SIMULATOR_UDID" \
              -derivedDataPath "$DERIVED_DATA_PATH" \
              -resultBundlePath "build/ios/screenshots-$appearance.xcresult" \
              -only-testing:FreeFlowUITests/FreeFlowScreenshotTests \
              -parallel-testing-enabled NO \
              -test-timeouts-enabled YES \
              -default-test-execution-time-allowance 600 \
              -maximum-test-execution-time-allowance 900 \
              || status=1
          done
          exit "$status"

      - name: Export screenshots
        if: always()
        run: |
          status=0
          for appearance in light dark; do
            .github/scripts/export-test-attachments.sh \
              "build/ios/screenshots-$appearance.xcresult" "$SCREENSHOTS_PATH/$appearance" || status=1
          done
          if [ -d "$SCREENSHOTS_PATH" ]; then
            find "$SCREENSHOTS_PATH" -name '*.png' | sort | head -120
          fi
          exit "$status"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-screenshots
          path: ${{ env.SCREENSHOTS_PATH }}
          if-no-files-found: warn
          retention-days: 14

  # Pull requests already run check.yml. Work-in-progress branch pushes don't,
  # so run the same macOS checks here: the iOS targets share Sources/ files and
  # ios/Shared/Core helpers with the macOS `make test` runner.
  macos-check:
    name: macOS make check (WIP pushes)
    if: github.event_name == 'push'
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run repository checks
        run: make check

  xcode-27-build:
    name: Build (Xcode 27 preview)
    # Pull requests and manual runs only, to save macOS runner slots while
    # work-in-progress branches iterate.
    if: github.event_name != 'push'
    runs-on: xcode-27
    # The xcode-27 image is a preview. Report breakage without failing the run.
    continue-on-error: true
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Uses the image's default Xcode 27, since preview images change weekly.
      - name: Show toolchain and simulators
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Build app, keyboard, and tests
        run: |
          xcodebuild build-for-testing \
            -project ios/FreeFlow.xcodeproj \
            -scheme FreeFlow \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/ios/DerivedData \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            DEVELOPMENT_TEAM=
